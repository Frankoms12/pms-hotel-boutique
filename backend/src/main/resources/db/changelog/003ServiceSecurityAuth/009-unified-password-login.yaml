databaseChangeLog:
  - changeSet:
      id: 003-auth-unified-password-009
      author: alan
      changes:
        - createTable:
            tableName: guest_password_credentials
            columns:
              - column: { name: guest_account_id, type: uuid, constraints: { primaryKey: true, nullable: false, foreignKeyName: fk_guest_password_account, references: guest_accounts(id) } }
              - column: { name: password_hash, type: varchar(255), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - sql:
            dbms: postgresql
            sql: |
              CREATE UNIQUE INDEX uq_guest_email_normalized ON guest_accounts (lower(btrim(email)));
      rollback:
        - sql: DROP INDEX uq_guest_email_normalized;
        - dropTable: { tableName: guest_password_credentials }

name: Docker Stack CI

on:
  pull_request:
    paths:
      - "compose.yaml"
      - ".env.example"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/**"
      - "frontend/pms-hotel-web/Dockerfile"
      - "frontend/pms-hotel-web/.dockerignore"
      - "frontend/pms-hotel-web/**"
      - ".github/workflows/stack-ci.yml"
  push:
    branches: [main]
    paths:
      - "compose.yaml"
      - ".env.example"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/**"
      - "frontend/pms-hotel-web/Dockerfile"
      - "frontend/pms-hotel-web/.dockerignore"
      - "frontend/pms-hotel-web/**"
      - ".github/workflows/stack-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait
      - run: curl --fail --retry 5 http://localhost:3001
      - if: always()
        run: docker compose down -v

name: pms-hotel-boutique

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pms_hotel
      POSTGRES_USER: pms_app
      POSTGRES_PASSWORD: ${PMS_POSTGRES_PASSWORD:-pms-local-development}
    volumes:
      - pms-hotel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms_app -d pms_hotel"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${PMS_SPRING_PROFILES_ACTIVE:-demo}
      PMS_DEMO_DATA_ENABLED: ${PMS_DEMO_DATA_ENABLED:-true}
      PMS_DATABASE_URL: jdbc:postgresql://postgres:5432/pms_hotel
      PMS_DATABASE_USERNAME: pms_app
      PMS_DATABASE_PASSWORD: ${PMS_POSTGRES_PASSWORD:-pms-local-development}
      PMS_JWT_SECRET: ${PMS_JWT_SECRET:-}
      PMS_RESERVATION_LINK_OTP_HMAC_KEY: ${PMS_RESERVATION_LINK_OTP_HMAC_KEY:-}
      PMS_BOOTSTRAP_ADMIN_USERNAME: ${PMS_BOOTSTRAP_ADMIN_USERNAME:-}
      PMS_BOOTSTRAP_ADMIN_EMAIL: ${PMS_BOOTSTRAP_ADMIN_EMAIL:-}
      PMS_BOOTSTRAP_ADMIN_PASSWORD: ${PMS_BOOTSTRAP_ADMIN_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:3001/api/auth/guest/google/callback
      PMS_EMAIL_PROVIDER: ${PMS_EMAIL_PROVIDER:-resend}
      PMS_SMTP_HOST: ${PMS_SMTP_HOST:-}
      PMS_SMTP_PORT: ${PMS_SMTP_PORT:-}
      PMS_SMTP_USERNAME: ${PMS_SMTP_USERNAME:-}
      PMS_SMTP_APP_PASSWORD: ${PMS_SMTP_APP_PASSWORD:-}
      PMS_SMTP_FROM: ${PMS_SMTP_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./frontend/pms-hotel-web
      args:
        NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_PROPERTY_ID: ${NEXT_PUBLIC_PROPERTY_ID:-3032709f-a48b-300b-b860-1110bc6f1f13}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      PMS_BACKEND_INTERNAL_URL: http://backend:8080
      PMS_WEB_PUBLIC_URL: http://localhost:3001
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pms-hotel-postgres:
